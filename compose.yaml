# Sample deployment. The server speaks plain HTTP - terminate TLS at your reverse
# proxy (caddy, traefik, nginx) in front of it.
services:
  lorestead:
    image: lorestead-server
    build: .
    ports:
      - "8080:8080"
    environment:
      # Both are required - the server refuses to start without them.
      LORESTEAD_TOKEN: change-me
      LORESTEAD_DB_KEY: change-me-too
      # Optional, shown with defaults:
      # LORESTEAD_HISTORY_RETENTION: 50   # versions kept per item (10-100)
      # LORESTEAD_PURGE_RETENTION_DAYS: 90
      # OAuth for claude.ai custom connectors - the three below enable it together.
      # Rotating the secret revokes every outstanding token on next start.
      # LORESTEAD_OAUTH_CLIENT_ID: lorestead
      # LORESTEAD_OAUTH_CLIENT_SECRET: generate-a-long-random-value
      # LORESTEAD_PUBLIC_URL: https://notes.example.com
      # Optional; defaults to the claude.ai and claude.com callbacks:
      # LORESTEAD_OAUTH_REDIRECT_URIS: https://claude.ai/api/mcp/auth_callback,https://claude.com/api/mcp/auth_callback
    volumes:
      # The container runs as non-root uid 1654; on a Linux host the bind-mounted
      # directory must be writable by it: chown -R 1654:1654 ./data
      - ./data:/data
    restart: unless-stopped
