name: Release

# Tag push (v1.2.3) is the real trigger; workflow_dispatch is a dry run that
# exercises the same jobs but publishes only :test image tags and no release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE_NAME: rthomasv3/lorestead-server

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Derive version from the tag
        id: meta
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # 0.0.1, not 0.0.0: Velopack rejects pack versions below 0.0.1.
            VERSION="0.0.1-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  docker:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Derive image tags
        id: meta
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAGS="${IMAGE_NAME}:${VERSION},ghcr.io/${IMAGE_NAME}:${VERSION}"
            # A hyphen marks a pre-release (semver); only stable versions move :latest.
            case "$VERSION" in
              *-*) ;;
              *) TAGS="${TAGS},${IMAGE_NAME}:latest,ghcr.io/${IMAGE_NAME}:latest" ;;
            esac
          else
            TAGS="${IMAGE_NAME}:test,ghcr.io/${IMAGE_NAME}:test"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: APP_VERSION=${{ needs.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          # The source label links the GHCR package to the repo.
          labels: |
            org.opencontainers.image.source=https://github.com/rthomasv3/Lorestead
            org.opencontainers.image.description=Lorestead sync server
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

  windows:
    needs: version
    runs-on: windows-latest
    # Pins the OIDC subject to repo:...:environment:release for every trigger, so one
    # Azure federated credential covers dispatch dry runs and tag pushes alike
    # (per-tag ref subjects cannot be wildcarded on the Azure side).
    environment: release
    permissions:
      # azure/login authenticates via OIDC federation; no client secret exists.
      id-token: write
      contents: read
    env:
      # vpk targets an older runtime than the repo's .NET 10; roll-forward bridges that.
      DOTNET_ROLL_FORWARD: Major
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/Lorestead.Client/FrontEnd/package-lock.json

      - name: Install vpk
        # Keep the CLI on the same version as the Velopack library reference.
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Write signing metadata
        shell: pwsh
        run: |
          $metadata = [ordered]@{
            Endpoint = '${{ secrets.SIGNING_ENDPOINT }}'
            CodeSigningAccountName = '${{ secrets.SIGNING_ACCOUNT_NAME }}'
            CertificateProfileName = '${{ secrets.SIGNING_PROFILE_NAME }}'
          } | ConvertTo-Json
          Set-Content -Path build/windows/signing-metadata.json -Value $metadata

      - name: Download existing release feed
        # Enables delta package generation; fails harmlessly before the first release.
        # Skipped on dispatch dry runs - their 0.0.0-ci version is lower than the
        # feed's latest, which vpk pack rejects.
        if: github.ref_type == 'tag'
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build/windows/output -Force | Out-Null
          vpk download github `
            --repoUrl https://github.com/rthomasv3/Lorestead `
            --channel win-x64 `
            --pre true `
            --outputDir build/windows/output

      - name: Build Windows installer with Velopack
        shell: pwsh
        run: |
          cd build/windows
          ./build-velopack.ps1 -Version ${{ needs.version.outputs.version }} -SignFile signing-metadata.json

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: build/windows/output
          if-no-files-found: error

  linux:
    needs: version
    # Jammy is deliberate, not just old: the AppImage bundles this runner's
    # webkit2gtk-4.1 binaries, so its glibc sets the compatibility floor.
    runs-on: ubuntu-22.04
    env:
      # vpk targets an older runtime than the repo's .NET 10; roll-forward bridges that.
      DOTNET_ROLL_FORWARD: Major
    steps:
      - uses: actions/checkout@v4

      - name: Install webkit build dependencies
        # Same package set as build/linux/Dockerfile so local docker builds and
        # CI harvest identical webkit binaries. squashfs-tools: vpk shells out
        # to mksquashfs to assemble the AppImage.
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev squashfs-tools

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/Lorestead.Client/FrontEnd/package-lock.json

      - name: Install vpk
        # Keep the CLI on the same version as the Velopack library reference.
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Download existing release feed
        # Enables delta package generation; fails harmlessly before the first release.
        # Skipped on dispatch dry runs - their ci version is lower than the feed's
        # latest, which vpk pack rejects.
        if: github.ref_type == 'tag'
        continue-on-error: true
        run: |
          mkdir -p build/linux/output
          vpk download github \
            --repoUrl https://github.com/rthomasv3/Lorestead \
            --channel linux-x64 \
            --pre true \
            --outputDir build/linux/output

      - name: Build Linux AppImage with Velopack
        run: |
          cd build/linux
          bash build-velopack.sh --version ${{ needs.version.outputs.version }}

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: build/linux/output
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-latest
    env:
      # vpk targets an older runtime than the repo's .NET 10; roll-forward bridges that.
      DOTNET_ROLL_FORWARD: Major
      KEYCHAIN_PATH: /tmp/lorestead-build.keychain-db
      NOTARY_PROFILE: lorestead-notary
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/Lorestead.Client/FrontEnd/package-lock.json

      - name: Install vpk
        # Keep the CLI on the same version as the Velopack library reference.
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Create keychain and import Developer ID certs
        env:
          APP_CERT_P12_B64: ${{ secrets.MACOS_DEVID_APP_CERT_P12 }}
          APP_CERT_PASSWORD: ${{ secrets.MACOS_DEVID_APP_CERT_PASSWORD }}
          INSTALLER_CERT_P12_B64: ${{ secrets.MACOS_DEVID_INSTALLER_CERT_P12 }}
          INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_DEVID_INSTALLER_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          echo "$APP_CERT_P12_B64" | base64 --decode > /tmp/app-cert.p12
          echo "$INSTALLER_CERT_P12_B64" | base64 --decode > /tmp/installer-cert.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import /tmp/app-cert.p12 -P "$APP_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security import /tmp/installer-cert.p12 -P "$INSTALLER_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          # Put the new keychain first in the search list so codesign finds our identities.
          EXISTING=$(security list-keychains -d user | xargs)
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING

          # Permit codesign/productbuild to use private keys without GUI prompt.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Wipe the p12 files on disk; the keys are now in the keychain only.
          rm -f /tmp/app-cert.p12 /tmp/installer-cert.p12

          echo "--- available signing identities ---"
          security find-identity -v "$KEYCHAIN_PATH"

      - name: Store notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --keychain "$KEYCHAIN_PATH"

      - name: Download existing release feed
        # Enables delta package generation; fails harmlessly before the first release.
        # Skipped on dispatch dry runs - their ci version is lower than the feed's
        # latest, which vpk pack rejects.
        if: github.ref_type == 'tag'
        continue-on-error: true
        run: |
          mkdir -p build/macos/output
          vpk download github \
            --repoUrl https://github.com/rthomasv3/Lorestead \
            --channel osx-arm64 \
            --pre true \
            --outputDir build/macos/output

      - name: Build macOS package with Velopack
        env:
          SIGN_APP_IDENTITY: ${{ secrets.MACOS_SIGN_APP_IDENTITY }}
          SIGN_INSTALL_IDENTITY: ${{ secrets.MACOS_SIGN_INSTALL_IDENTITY }}
        run: |
          cd build/macos
          bash build-velopack.sh --version ${{ needs.version.outputs.version }} \
            --sign-app-identity "$SIGN_APP_IDENTITY" \
            --sign-install-identity "$SIGN_INSTALL_IDENTITY" \
            --notary-profile "$NOTARY_PROFILE" \
            --keychain "$KEYCHAIN_PATH"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: osx-arm64
          path: build/macos/output
          if-no-files-found: error

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f /tmp/app-cert.p12 /tmp/installer-cert.p12
