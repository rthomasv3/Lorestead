name: Release

# Tag push (v1.2.3) is the real trigger; workflow_dispatch is a dry run that
# exercises the same jobs but publishes only :test image tags and no release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE_NAME: rthomasv3/lorestead-server

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Derive version and image tags
        id: meta
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAGS="${IMAGE_NAME}:${VERSION},ghcr.io/${IMAGE_NAME}:${VERSION}"
            # A hyphen marks a pre-release (semver); only stable versions move :latest.
            case "$VERSION" in
              *-*) ;;
              *) TAGS="${TAGS},${IMAGE_NAME}:latest,ghcr.io/${IMAGE_NAME}:latest" ;;
            esac
          else
            VERSION="0.0.0-ci.${GITHUB_RUN_NUMBER}"
            TAGS="${IMAGE_NAME}:test,ghcr.io/${IMAGE_NAME}:test"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          # The source label links the GHCR package to the repo.
          labels: |
            org.opencontainers.image.source=https://github.com/rthomasv3/Lorestead
            org.opencontainers.image.description=Lorestead sync server
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
